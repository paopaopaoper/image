services:
  postgres:
    image: postgres:16-alpine
    container_name: grad-art-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gradart
      POSTGRES_PASSWORD: gradart123
      POSTGRES_DB: graduation_art
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: grad-art-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
